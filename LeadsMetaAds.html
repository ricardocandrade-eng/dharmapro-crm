<!-- ══════════════════════════════════════════════════════════════════════════
     Módulo: Leads Meta Ads | DharmaPro | redesign Agosto/2026
     Visual "Sistema B" (mesma linguagem de Dashboard.html / Relatorios.html).
     ══════════════════════════════════════════════════════════════════════════ -->
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,700&family=Instrument+Serif:ital@0;1&family=Martian+Mono:wght@300;400;500;600&display=swap" rel="stylesheet">

<style>
/* ═══ LEADS META ADS ═══════════════════════════════════════════════════════
   O conteúdo vive isolado em #lmaContainer (all:initial + reset universal).
   Os 2 modais ficam FORA dele, como irmãos: usam as classes globais do
   Index (.modal-overlay/.modal-box) e o reset daqui zeraria os paddings.   */
#pageLeadsMetaAds.ativa {
  display: block !important;
  position: fixed; top: 49px; left: 230px; right: 0; bottom: 0;
  overflow: hidden; z-index: 10;
}
#lmaContainer{all:initial;display:block;width:100%;height:100%;overflow-y:auto;background:#08090e;color:#dde2f0;font-family:'DM Sans',sans-serif;position:relative}
#lmaContainer *,#lmaContainer *::before,#lmaContainer *::after{box-sizing:border-box;margin:0;padding:0}
#lmaContainer{--bg:#08090e;--s1:#0e1018;--s2:#131620;--s3:#191d2c;--rim:rgba(255,255,255,.06);--rim2:rgba(255,255,255,.12);--txt:#dde2f0;--dim:#5a6080;--dim2:#8490b8;--em:#f0f4ff;--g1:#c8ff5e;--g2:#00d4ff;--g3:#ff4570;--g4:#ffaa00;--g5:#a78bfa;--mono:'Martian Mono',monospace;--r:14px}
#lmaContainer::-webkit-scrollbar{width:4px;height:8px}
#lmaContainer::-webkit-scrollbar-track{background:transparent}
#lmaContainer::-webkit-scrollbar-thumb{background:var(--rim2);border-radius:2px}

/* ── Header sticky (absorve total, novos hoje, perdidos e o dot de reconciliação) ── */
#lmaContainer .lma-top{position:sticky;top:0;z-index:100;height:52px;padding:0 24px;display:flex;align-items:center;gap:14px;background:rgba(8,9,14,.92);backdrop-filter:blur(24px);border-bottom:1px solid var(--rim)}
#lmaContainer .lma-title{font-family:var(--mono);font-size:11px;font-weight:600;letter-spacing:.2em;color:var(--dim2);text-transform:uppercase;white-space:nowrap}
#lmaContainer .lma-sub{font-family:var(--mono);font-size:10px;color:var(--dim);letter-spacing:.06em;margin-top:4px;white-space:nowrap}
#lmaContainer .lma-sub b{color:var(--dim2);font-weight:500}
#lmaContainer .lma-sub .warn{color:var(--g4)}
#lmaContainer .lma-sub .good{color:var(--g1)}
#lmaContainer .lma-dot{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--g1);margin-right:5px;vertical-align:middle}
#lmaContainer .lma-dot.warn{background:var(--g4)}
#lmaContainer .lma-dot.off{background:var(--dim)}
#lmaContainer .lma-top-right{margin-left:auto;display:flex;align-items:center;gap:8px}

#lmaContainer .lma-btn{padding:7px 12px;border-radius:8px;background:var(--s2);border:1px solid var(--rim);color:var(--dim2);font-size:11px;font-weight:600;cursor:pointer;font-family:var(--mono);letter-spacing:.05em;transition:all .15s;white-space:nowrap}
#lmaContainer .lma-btn:hover{background:var(--s3);color:var(--em);border-color:var(--rim2)}
#lmaContainer .lma-btn.ico{padding:7px 10px;font-size:12px}
#lmaContainer .lma-btn.accent{background:rgba(0,212,255,.08);border-color:rgba(0,212,255,.22);color:var(--g2)}
#lmaContainer .lma-btn.accent:hover{background:rgba(0,212,255,.16)}

#lmaContainer .lma-seg{display:inline-flex;border:1px solid var(--rim);border-radius:8px;overflow:hidden}
#lmaContainer .lma-seg-b{padding:7px 12px;background:var(--s2);border:none;color:var(--dim);font-size:11px;font-family:var(--mono);letter-spacing:.05em;cursor:pointer}
#lmaContainer .lma-seg-b:hover{color:var(--em)}
#lmaContainer .lma-seg-b.on{background:var(--s3);color:var(--em)}

#lmaContainer .lma-tag{display:inline-flex;align-items:center;gap:6px;padding:6px 10px;border-radius:8px;background:transparent;border:1px solid var(--rim);color:var(--dim);font-family:var(--mono);font-size:10px;letter-spacing:.08em;cursor:pointer}
#lmaContainer .lma-tag:hover{border-color:var(--rim2)}
#lmaContainer .lma-tag.on{color:var(--g1);border-color:rgba(200,255,94,.24)}
#lmaContainer .lma-tag-dot{width:6px;height:6px;border-radius:50%;background:var(--dim);display:inline-block}
#lmaContainer .lma-tag.on .lma-tag-dot{background:var(--g1)}
#lmaContainer .lma-tag-dot.girando{animation:lmapulse .9s ease}
@keyframes lmapulse{0%{transform:scale(1);opacity:1}50%{transform:scale(2.2);opacity:.3}100%{transform:scale(1);opacity:1}}

/* ── Faixa de aviso: só aparece quando há divergência real (severidade=aviso) ── */
#lmaContainer .lma-aviso{display:none;align-items:center;gap:10px;padding:8px 24px;background:rgba(255,170,0,.07);border-bottom:1px solid rgba(255,170,0,.18);color:var(--g4);font-family:var(--mono);font-size:10px;letter-spacing:.04em}
#lmaContainer .lma-aviso.on{display:flex}
#lmaContainer .lma-aviso-txt{flex:1;min-width:0}
#lmaContainer .lma-aviso-x{background:none;border:none;color:inherit;cursor:pointer;font-size:12px;opacity:.7;padding:0 2px}
#lmaContainer .lma-aviso-x:hover{opacity:1}

/* ── Canvas + KPIs ── */
#lmaContainer .lma-canvas{padding:16px 24px 90px}
/* KPIs e filtros dividem a mesma faixa: empilhados, custavam ~90px de altura à toa */
#lmaContainer .lma-controles{display:flex;gap:12px;align-items:stretch;margin-bottom:14px}
#lmaContainer .lma-kpis{display:grid;grid-template-columns:repeat(3,minmax(0,172px));gap:12px;flex-shrink:0}
@media(max-width:1180px){
  #lmaContainer .lma-controles{flex-direction:column}
  #lmaContainer .lma-kpis{grid-template-columns:repeat(3,1fr)}
}
#lmaContainer .kpi{background:var(--s1);border:1px solid var(--rim);border-radius:var(--r);padding:13px 15px}
#lmaContainer .kpi-t{font-family:var(--mono);font-size:9px;letter-spacing:.18em;text-transform:uppercase;color:var(--dim);margin-bottom:8px}
#lmaContainer .kpi-v{font-size:24px;font-weight:700;color:var(--em);line-height:1}
#lmaContainer .kpi-d{font-family:var(--mono);font-size:10px;margin-top:8px;letter-spacing:.04em;color:var(--dim)}
#lmaContainer .kpi-d.warn{color:var(--g4)}
#lmaContainer .kpi-d.good{color:var(--g1)}

/* ── Barra de filtros ── */
#lmaContainer .lma-filtros{flex:1;min-width:0;display:flex;flex-wrap:wrap;align-items:center;align-content:center;gap:8px;padding:10px 12px;background:var(--s1);border:1px solid var(--rim);border-radius:var(--r)}
#lmaContainer .lma-fgroup{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
#lmaContainer .lma-flabel{font-family:var(--mono);font-size:9px;letter-spacing:.18em;text-transform:uppercase;color:var(--dim);margin-right:2px}
#lmaContainer .lma-fspacer{flex:1}
#lmaContainer .chip{padding:5px 11px;border-radius:7px;background:var(--s2);border:1px solid var(--rim);color:var(--dim2);font-size:11px;font-weight:500;cursor:pointer;font-family:var(--mono);letter-spacing:.03em;transition:all .12s;white-space:nowrap}
#lmaContainer .chip:hover{background:var(--s3);color:var(--em)}
#lmaContainer .chip.on{background:rgba(200,255,94,.1);border-color:rgba(200,255,94,.3);color:var(--g1)}
#lmaContainer .lma-busca{background:var(--s2);border:1px solid var(--rim);color:var(--txt);border-radius:7px;padding:6px 10px;font-size:11px;font-family:var(--mono);min-width:220px}
#lmaContainer .lma-busca:focus{outline:none;border-color:var(--rim2)}
#lmaContainer .lma-busca::placeholder{color:var(--dim)}
#lmaContainer input[type=date]{background:var(--s2);border:1px solid var(--rim);color:var(--txt);border-radius:7px;padding:5px 8px;font-size:11px;font-family:var(--mono);color-scheme:dark}
#lmaContainer .lma-fcount{font-family:var(--mono);font-size:9px;background:rgba(0,212,255,.18);color:var(--g2);border-radius:20px;padding:1px 6px;margin-left:2px}
#lmaContainer .lma-flink{background:none;border:none;color:var(--dim);font-size:11px;font-family:var(--mono);cursor:pointer;text-decoration:underline;padding:4px 2px}
#lmaContainer .lma-flink:hover{color:var(--dim2)}
#lmaContainer .lma-fpanel{display:none;flex-basis:100%;gap:8px;flex-wrap:wrap;align-items:center;padding-top:10px;border-top:1px solid var(--rim)}
#lmaContainer .lma-fpanel.aberto{display:flex}
#lmaContainer select.lma-select{background:var(--s2);border:1px solid var(--rim);color:var(--txt);border-radius:7px;padding:5px 8px;font-size:11px;font-family:var(--mono);cursor:pointer;min-width:152px}
#lmaContainer select.lma-select:focus{outline:none;border-color:var(--rim2)}
/* <option> herda o tema claro do SO se não pintar explicitamente (ver CLAUDE.md) */
#lmaContainer select option{background:#131620;color:#dde2f0}

/* ── Tabela ── */
#lmaContainer table.lma-tbl{width:100%;border-collapse:collapse;font-size:12px}
#lmaContainer table.lma-tbl thead th{position:sticky;top:52px;z-index:20;text-align:left;font-family:var(--mono);font-size:9px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--dim);padding:9px 14px;background:#08090e;border-bottom:1px solid var(--rim);white-space:nowrap}
#lmaContainer table.lma-tbl td{padding:9px 14px;border-bottom:1px solid rgba(255,255,255,.035);color:var(--txt);vertical-align:middle}
#lmaContainer table.lma-tbl tbody tr:hover td{background:rgba(255,255,255,.022)}
#lmaContainer table.lma-tbl tr.lma-tr-conv td:first-child{box-shadow:inset 2px 0 0 var(--g1)}
#lmaContainer table.lma-tbl tr.lma-tr-risco td:first-child{box-shadow:inset 2px 0 0 var(--g4)}
#lmaContainer .lma-th-sort{cursor:pointer;user-select:none}
#lmaContainer .lma-th-sort:hover{color:var(--dim2)}
#lmaContainer .lma-sort-ind{font-size:8px;color:var(--g2)}

#lmaContainer .lma-mono{font-family:var(--mono);font-size:10px;letter-spacing:.02em;white-space:nowrap;color:var(--dim2)}
#lmaContainer .lma-ago{font-family:var(--mono);font-size:9px;color:var(--dim);margin-top:3px;letter-spacing:.04em;white-space:nowrap}
#lmaContainer .lma-nome{font-size:12.5px;font-weight:600;color:var(--em)}
#lmaContainer .lma-nome-edit{cursor:pointer;border-bottom:1px dashed transparent}
#lmaContainer .lma-nome-edit:hover{border-bottom-color:var(--dim)}
#lmaContainer .lma-linha2{display:flex;align-items:center;gap:7px;margin-top:4px;flex-wrap:wrap}
#lmaContainer .lma-tel{font-family:var(--mono);font-size:10px;color:var(--dim2);letter-spacing:.02em}
#lmaContainer .lma-nome-input,#lmaContainer .lma-cidade-input{background:var(--s2);border:1px solid var(--rim2);color:var(--em);border-radius:6px;padding:3px 6px;font-family:var(--mono);font-size:11px;width:100%;max-width:190px}
#lmaContainer .lma-nome-input:focus,#lmaContainer .lma-cidade-input:focus{outline:none;border-color:var(--g2)}
#lmaContainer .lma-cidade-edit{cursor:pointer;border-bottom:1px dashed transparent;font-family:var(--mono);font-size:10.5px;color:var(--txt)}
#lmaContainer .lma-cidade-edit:hover{border-bottom-color:var(--dim)}
#lmaContainer .lma-cidade-sug{color:var(--dim);font-style:italic}
#lmaContainer .lma-cidade-vazia{color:var(--dim)}

#lmaContainer .lma-chip-camp{display:inline-block;max-width:200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;vertical-align:middle;padding:2px 8px;border-radius:6px;font-size:10px;font-family:var(--mono);border:1px solid;letter-spacing:.02em}
#lmaContainer .lma-anun{font-family:var(--mono);font-size:9px;color:var(--dim);margin-top:4px;letter-spacing:.04em;white-space:nowrap}
#lmaContainer .lma-origem-chip{padding:1px 6px;border-radius:5px;font-size:9px;font-family:var(--mono);white-space:nowrap;border:1px solid var(--rim)}
#lmaContainer .lma-origem-chip.og-webhook{background:var(--s2);color:var(--dim)}
#lmaContainer .lma-origem-chip.og-manual{background:rgba(0,212,255,.1);color:var(--g2);border-color:rgba(0,212,255,.22)}
#lmaContainer .lma-origem-chip.og-renata{background:rgba(167,139,250,.12);color:var(--g5);border-color:rgba(167,139,250,.24)}
#lmaContainer .lma-copy{background:none;border:1px solid var(--rim);color:var(--dim);border-radius:5px;padding:1px 6px;font-size:9px;font-family:var(--mono);cursor:pointer;line-height:1.5}
#lmaContainer .lma-copy:hover{color:var(--em);border-color:var(--rim2)}
#lmaContainer .cw-link{display:inline-block;padding:1px 7px;border-radius:5px;font-family:var(--mono);font-size:9px;text-decoration:none;background:rgba(0,212,255,.1);border:1px solid rgba(0,212,255,.22);color:var(--g2);white-space:nowrap}
#lmaContainer .cw-link:hover{background:rgba(0,212,255,.18)}

#lmaContainer .lma-badge{display:inline-block;padding:3px 9px;border-radius:6px;font-size:10px;font-family:var(--mono);white-space:nowrap;border:1px solid;letter-spacing:.02em}
#lmaContainer .lma-badge.pendente{background:var(--s2);border-color:var(--rim);color:var(--dim2)}
#lmaContainer .lma-badge.converteu{background:rgba(200,255,94,.1);border-color:rgba(200,255,94,.28);color:var(--g1)}
#lmaContainer .lma-badge.desqualificado{background:rgba(255,69,112,.1);border-color:rgba(255,69,112,.26);color:var(--g3)}
#lmaContainer .lma-badge.negociacao{background:rgba(0,212,255,.1);border-color:rgba(0,212,255,.26);color:var(--g2)}
#lmaContainer .lma-badge.sem-contato{background:rgba(255,170,0,.1);border-color:rgba(255,170,0,.26);color:var(--g4)}
#lmaContainer .lma-badge-motivo{display:block;font-family:var(--mono);font-size:9px;color:var(--dim);margin-top:4px;letter-spacing:.04em}

/* ── Coluna Ação: select que salva no change + menu ⋯ ── */
#lmaContainer td.lma-acao-cell{position:relative;width:1%;white-space:nowrap}
#lmaContainer .lma-acao-row{display:flex;align-items:center;gap:6px}
#lmaContainer select.lma-acao-sel{background:var(--s2);border:1px solid var(--rim);color:var(--dim2);border-radius:7px;padding:5px 8px;font-size:10px;font-family:var(--mono);cursor:pointer;width:162px}
#lmaContainer select.lma-acao-sel:focus{outline:none;border-color:var(--g2)}
#lmaContainer select.lma-acao-sel:disabled{opacity:.45;cursor:default}
#lmaContainer select.lma-acao-motivo{background:var(--s2);border:1px solid rgba(255,69,112,.3);color:var(--txt);border-radius:7px;padding:5px 8px;font-size:10px;font-family:var(--mono);cursor:pointer;width:100%}
#lmaContainer select.lma-acao-motivo:focus{outline:none;border-color:var(--g3)}
#lmaContainer .lma-acao-motivo-row{margin-top:6px;display:none}
#lmaContainer .lma-acao-motivo-row.on{display:block}
#lmaContainer .lma-kebab{background:none;border:1px solid transparent;color:var(--dim);border-radius:6px;padding:2px 7px;font-size:14px;line-height:1.2;cursor:pointer}
#lmaContainer .lma-kebab:hover{color:var(--em);border-color:var(--rim)}
#lmaContainer .lma-menu{position:absolute;right:12px;top:calc(100% - 8px);z-index:60;background:var(--s2);border:1px solid var(--rim2);border-radius:9px;padding:5px;min-width:176px;box-shadow:0 14px 36px rgba(0,0,0,.6)}
#lmaContainer .lma-menu button{display:block;width:100%;text-align:left;background:none;border:none;color:var(--txt);font-size:11px;font-family:var(--mono);padding:7px 9px;border-radius:6px;cursor:pointer;white-space:nowrap}
#lmaContainer .lma-menu button:hover{background:var(--s3)}
#lmaContainer .lma-menu button.danger{color:var(--g3)}

#lmaContainer .lma-empty{padding:56px;text-align:center;color:var(--dim);font-family:var(--mono);font-size:11.5px;letter-spacing:.04em}
#lmaContainer .lma-erro{padding:56px;text-align:center;color:var(--g3);font-family:var(--mono);font-size:11.5px}

/* ── Kanban ── */
#lmaContainer .lma-kanban{display:flex;gap:12px;align-items:flex-start;overflow-x:auto;padding-bottom:12px}
#lmaContainer .lma-kanban::-webkit-scrollbar{height:6px}
#lmaContainer .lma-kanban::-webkit-scrollbar-thumb{background:var(--rim2);border-radius:2px}
#lmaContainer .lma-kcol{flex:1;min-width:228px;background:var(--s1);border:1px solid var(--rim);border-radius:var(--r);display:flex;flex-direction:column;max-height:calc(100vh - 300px)}
#lmaContainer .lma-kcol.k-over{border-color:var(--rim2);background:var(--s2)}
#lmaContainer .lma-kcol-head{padding:11px 13px;font-family:var(--mono);font-size:9px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim);border-bottom:1px solid var(--rim);display:flex;justify-content:space-between;align-items:center;gap:8px}
#lmaContainer .lma-kcol-count{font-family:var(--mono);font-size:10px;color:var(--dim2);background:var(--s3);border-radius:20px;padding:1px 7px}
#lmaContainer .lma-kcol.k-nego .lma-kcol-head{color:var(--g2)}
#lmaContainer .lma-kcol.k-conv .lma-kcol-head{color:var(--g1)}
#lmaContainer .lma-kcol.k-desq .lma-kcol-head{color:var(--g3)}
#lmaContainer .lma-kcol-body{padding:9px;overflow-y:auto;display:flex;flex-direction:column;gap:8px}
#lmaContainer .lma-kcol-body::-webkit-scrollbar{width:3px}
#lmaContainer .lma-kcol-body::-webkit-scrollbar-thumb{background:var(--rim2);border-radius:2px}
#lmaContainer .lma-kcol-vazio{color:var(--dim);font-family:var(--mono);font-size:10px;text-align:center;padding:14px}
#lmaContainer .lma-kcard{background:var(--s2);border:1px solid var(--rim);border-radius:10px;padding:10px 11px;cursor:grab}
#lmaContainer .lma-kcard:hover{border-color:var(--rim2)}
#lmaContainer .lma-kcard:active{cursor:grabbing}
#lmaContainer .lma-kcard.kc-conv{box-shadow:inset 2px 0 0 var(--g1)}
#lmaContainer .lma-kcard.kc-risco{box-shadow:inset 2px 0 0 var(--g4)}
#lmaContainer .lma-kcard-nome{font-size:12px;font-weight:600;color:var(--em);margin-bottom:5px}
#lmaContainer .lma-kcard-tel{font-family:var(--mono);font-size:10px;color:var(--dim2);margin-bottom:6px;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
#lmaContainer .lma-kcard-cidade{font-family:var(--mono);font-size:9px;color:var(--dim);margin-bottom:7px}
#lmaContainer .lma-kcard-tags{display:flex;gap:5px;flex-wrap:wrap}

/* ═══ MODAIS ═══ ficam FORA de #lmaContainer, no visual global do Index. ═══ */
.lma-m-label{display:block;font-size:10px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:1px;margin-bottom:5px}
.lma-m-row{display:flex;flex-direction:column;gap:14px}
.lma-m-input,.lma-m-select{width:100%;box-sizing:border-box;padding:7px 10px;background:var(--surface2);border:1px solid var(--border);border-radius:7px;color:var(--text);font-size:12px;font-family:'Sora',sans-serif}
.lma-m-input:focus,.lma-m-select:focus{outline:none;border-color:var(--accent)}
.lma-m-select{cursor:pointer}
.lma-m-btn{display:inline-flex;align-items:center;gap:7px;padding:8px 16px;background:var(--surface2);color:var(--text);border:1px solid var(--border);border-radius:8px;font-size:12px;font-weight:700;font-family:'Sora',sans-serif;cursor:pointer;transition:background .2s}
.lma-m-btn:hover{background:var(--border)}
.lma-m-btn.primary{background:var(--accent);color:#fff;border-color:var(--accent)}
.lma-m-btn.primary:hover{opacity:.85}
#mlStatus{margin:10px 0 0;font-size:11px;font-family:'DM Mono',monospace;text-align:center;min-height:16px;color:var(--muted)}
.lma-relatorio-text{width:100%;min-height:260px;resize:vertical;box-sizing:border-box;background:var(--surface2);color:var(--text);border:1px solid var(--border);border-radius:8px;padding:12px;font-size:13px;line-height:1.55;font-family:'DM Mono',Consolas,monospace;white-space:pre-wrap}
</style>

<!-- ══ PÁGINA ══ -->
<div id="pageLeadsMetaAds" class="page">
 <div id="lmaContainer">

  <!-- Header: identidade + resumo (total · novos hoje · perdidos · sync) + ações -->
  <div class="lma-top">
    <div>
      <div class="lma-title">◈ Leads Meta Ads</div>
      <div class="lma-sub" id="lmaSub">carregando…</div>
    </div>
    <div class="lma-top-right">
      <button class="lma-tag" id="lmaAutoTag" onclick="_lmaToggleAutoRefresh()" title="Recarrega os leads sozinho a cada 60s enquanto esta página estiver aberta">
        <span class="lma-tag-dot" id="lmaRefreshSpin"></span> auto
      </button>
      <div class="lma-seg">
        <button id="lmaViewLista"  class="lma-seg-b on" onclick="_lmaSetView('lista')">Lista</button>

<script>
var _lmaDados = [];
var _lmaListaFiltrada = [];
var _lmaRelatorioAtual = '';
var _lmaView    = 'lista';   // 'lista' | 'kanban' (persistido em localStorage)
var _lmaAutoOn  = false;     // auto-refresh ligado
var _lmaTimer   = null;      // handle do setInterval
var _lmaSortCol = 'data_entrada';
var _lmaSortDir = 'desc';    // 'asc' | 'desc' | '' (sem ordenação)
var _lmaPeriodo = 'mes';     // hoje | semana | mes | 30d | custom

// MOTIVO DESQUALIFICAÇÃO (col J): read-only desde a migração pra taxonomia do
// Chatwoot — a própria etiqueta descreve o desfecho (sem-viabilidade,
// sem-interesse, reprovado-cpf…), então nada grava esse campo há tempos. O
// valor legado continua visível no badge de Status e filtrável no painel
// avançado; o <select> de motivo por linha era markup morto e saiu.

function carregarLeadsMetaAds() {
  var tbody = document.getElementById('lmaTbody');
  if (!tbody) {
    if (typeof mostrarToast === 'function') mostrarToast('Erro interno: elemento lmaTbody não encontrado. Recarregue a página.', 'error');
    return;
  }

  tbody.innerHTML = '<tr><td colspan="6" class="lma-empty">Carregando…</td></tr>';

  function falha(msg) {
    tbody.innerHTML = '<tr><td colspan="6" class="lma-erro">' + _esc(msg) + '</td></tr>';
  }

  try {
    google.script.run
      .withSuccessHandler(function(res) {
        try {
          if (!res || res.erro) { falha('Erro: ' + (res && res.erro ? res.erro : 'resposta inválida')); return; }
          _lmaDados = res.leads || [];
          _lmaPopularFiltros();
          _lmaFiltrar();
          _lmaCarregarReconc();
        } catch(e) { falha('Erro ao renderizar: ' + e.message); }
      })
      .withFailureHandler(function(err) {
        falha('Erro ao carregar: ' + (err && err.message ? err.message : String(err)));
      })
      .getLeadsMetaAds();
  } catch(e) { falha('Erro: ' + e.message); }
}

// ── Parsers / helpers ──
function _lmaParseBR(s) {
  s = String(s || '').trim();
  var m = s.match(/^(\d{2})\/(\d{2})\/(\d{4})(?:[ T](\d{2}):(\d{2}))?/);
  if (m) return new Date(+m[3], +m[2] - 1, +m[1], +(m[4] || 0), +(m[5] || 0));
  var d = new Date(s); return isNaN(d.getTime()) ? null : d;
}
function _lmaNormTel(t) {
  var d = String(t || '').replace(/\D/g, '');
  if (d.length > 11 && d.indexOf('55') === 0) d = d.slice(2);
  return d;
}
function _lmaInicioHoje() { var d = new Date(); d.setHours(0, 0, 0, 0); return d; }

// ── Popular dropdowns dinâmicos (campanha / anúncio / motivo) a partir dos dados ──
function _lmaPopularFiltros() {
  function popular(id, getter, labelTodos) {
    var sel = document.getElementById(id); if (!sel) return;
    var atual = sel.value, vals = {};
    _lmaDados.forEach(function(l) { var v = getter(l); if (v) vals[v] = true; });
    sel.innerHTML = '<option value="">' + labelTodos + '</option>';
    Object.keys(vals).sort().forEach(function(v) {
      sel.innerHTML += '<option value="' + _esc(v) + '">' + _esc(v) + '</option>';
    });
    if (atual) sel.value = atual; // preserva seleção
  }
  popular('lmaFiltroCampanha', function(l) { return l.utm_campaign; }, 'Campanha: todas');
  popular('lmaFiltroAnuncio',  function(l) { return l.utm_ad; },       'Anúncio: todos');
  popular('lmaFiltroMotivo',   function(l) { return l.motivo_desq; },  'Motivo: todos');
}

// ── Intervalo do período selecionado ──
function _lmaIntervaloPeriodo() {
  var hoje = new Date();
  if (_lmaPeriodo === 'hoje')   { return { desde: _lmaInicioHoje(), ate: null }; }
  if (_lmaPeriodo === 'semana') { var s = new Date(); s.setDate(s.getDate() - 6); s.setHours(0,0,0,0); return { desde: s, ate: null }; }
  if (_lmaPeriodo === 'mes')    { return { desde: new Date(hoje.getFullYear(), hoje.getMonth(), 1), ate: null }; }
  if (_lmaPeriodo === '30d')    { var d = new Date(); d.setDate(d.getDate() - 29); d.setHours(0,0,0,0); return { desde: d, ate: null }; }
  if (_lmaPeriodo === 'custom') {
    var dv = document.getElementById('lmaDesde').value, av = document.getElementById('lmaAte').value;
    return { desde: dv ? new Date(dv + 'T00:00:00') : null, ate: av ? new Date(av + 'T23:59:59') : null };
  }
  return { desde: null, ate: null };
}

// ── Match de um lead contra os filtros (opts.ignorarPeriodo p/ KPI "Novos hoje") ──
function _lmaMatch(l, opts) {
  opts = opts || {};
  var fStatus = document.getElementById('lmaFiltroStatus').value;
  var fCamp   = document.getElementById('lmaFiltroCampanha').value;
  var fAnun   = document.getElementById('lmaFiltroAnuncio').value;
  var fMot    = document.getElementById('lmaFiltroMotivo').value;
  var fEst    = document.getElementById('lmaFiltroEstado').value;
  var fOrig   = document.getElementById('lmaFiltroOrigem').value;
  var busca   = (document.getElementById('lmaBusca').value || '').toLowerCase();

  if (fStatus === '__aberto' && l.status_final) return false;
  if (fStatus && fStatus !== '__aberto' && !_lmaStatusMesmo(l.status_final, fStatus)) return false;
  if (fCamp && l.utm_campaign !== fCamp) return false;
  if (fAnun && l.utm_ad !== fAnun) return false;
  if (fMot && l.motivo_desq !== fMot) return false;
  if (fOrig && (String(l.origem || 'webhook').toLowerCase() !== fOrig)) return false;
  if (fEst) {
    var cob = inferirCoberturaPorDDD(l.telefone);
    if (fEst === '__cobertura') { if (cob !== 'sim' && cob !== 'parcial') return false; }
    else if (fEst === '__fora') { if (cob !== 'nao') return false; }
    else if (inferirEstadoPorDDD(l.telefone) !== fEst) return false;
  }
  if (busca) {
    var hay = ((l.nome || '') + ' ' + (l.telefone || '')).toLowerCase();
    if (hay.indexOf(busca) < 0) return false;
  }
  if (!opts.ignorarPeriodo) {
    var iv = _lmaIntervaloPeriodo();
    if (iv.desde || iv.ate) {
      var dt = _lmaParseBR(l.data_entrada);
      if (!dt) return false;
      if (iv.desde && dt < iv.desde) return false;
      if (iv.ate && dt > iv.ate) return false;
    }
  }
  return true;
}

// ── Ordenação ──
function _lmaOrdenar(lista) {
  if (!_lmaSortDir) return lista;
  var col = _lmaSortCol, dir = _lmaSortDir === 'asc' ? 1 : -1;
  var dateCols = { data_entrada: 1, data_status: 1 };
  return lista.slice().sort(function(a, b) {
    if (dateCols[col]) {
      var da = _lmaParseBR(a[col]), db = _lmaParseBR(b[col]);
      return ((da ? da.getTime() : 0) - (db ? db.getTime() : 0)) * dir;
    }
    var va = String(a[col] || '').toLowerCase(), vb = String(b[col] || '').toLowerCase();
    return va < vb ? -dir : va > vb ? dir : 0;
  });
}

// ── Pipeline: filtra + ordena + KPIs + render da view atual ──
function _lmaFiltrar() {
  var lista = _lmaOrdenar(_lmaDados.filter(function(l) { return _lmaMatch(l, {}); }));
  _lmaListaFiltrada = lista;

  _lmaFecharMenu();          // um re-render invalida qualquer menu ⋯ aberto
  _lmaAtualizarKPIs(lista);  // escreve os 3 KPIs E o resumo do header
  _lmaAtualizarSortInd();
  _lmaContarFiltrosAtivos();

  if (_lmaView === 'kanban') _lmaRenderKanban(lista);
  else _lmaRenderizarTabela(lista);

  // Chatwoot: injeta o link "💬 Conversa" nos leads que casam por telefone.
  // Fora do caminho de render — preenche o que já tem em mãos e carrega o mapa
  // na 1ª vez (mesma chave de sessionStorage da Lista de Vendas: mapa é 1 só).
  _cwPreencherSlots();
  _cwCarregarMapa();
}

// ─── CHATWOOT — link "abrir conversa" no lead ──────────────────────────────
// Espelha o mecanismo da Lista de Vendas (JS.html): getMapaConversasChatwoot()
// devolve telefone → id da conversa; cada slot é preenchido depois do render.
// Escopo: só conversas que passam pela Renata (número WABA) — lead cujo telefone
// não casa simplesmente não mostra o botão.
var _cwMapa = null;         // { '32988306393': '1120' }
var _cwCfg  = null;         // { baseUrl, accountId }
var _cwCarregando = false;
var CW_SS_KEY = 'dharmapro_chatwoot_v1';   // MESMA chave da Lista — cache único
var CW_SS_TTL = 300000;                    // 5 min

// Normalização canônica DDD+8 (igual ao backend _cwNormPhone_). NÃO é o
// _lmaNormTel, que para em DDD+9 — as chaves do mapa são DDD+8.
function _cwNormPhone(p) {
  var d = String(p == null ? '' : p).replace(/\D/g, '');
  if (d.length >= 12 && d.substr(0, 2) === '55') d = d.substr(2);
  if (d.length === 11 && d.charAt(2) === '9')    d = d.substr(0, 2) + d.substr(3);
  return d;
}

// Slot vazio na célula do telefone; preenchido por _cwPreencherSlots.
function _cwSlot(l) {
  var ph = _cwNormPhone(l && l.telefone);
  if (ph.length < 10) return '';
  return '<span class="cw-slot" data-cwphone="' + ph + '"></span>';
}

function _cwPreencherSlots() {
  if (!_cwMapa || !_cwCfg || !_cwCfg.accountId) return;
  var slots = document.querySelectorAll('.cw-slot');
  for (var i = 0; i < slots.length; i++) {
    var el = slots[i];
    if (el.dataset.cwDone === '1') continue;
    var conv = _cwMapa[el.dataset.cwphone];
    if (!conv) continue;
    var url = _cwCfg.baseUrl + '/app/accounts/' + _cwCfg.accountId + '/conversations/' + conv;
    // stopPropagation: no kanban o card é arrastável / clicável.
    el.innerHTML = '<a class="cw-link" href="' + _esc(url) + '" target="_blank" rel="noopener"' +
                   ' onclick="event.stopPropagation()" title="Abrir conversa no Chatwoot">💬 Conversa</a>';
    el.dataset.cwDone = '1';
  }
}

function _cwCarregarMapa() {
  if (_cwCarregando) return;
  try {
    var raw = sessionStorage.getItem(CW_SS_KEY);
    if (raw) {
      var ss = JSON.parse(raw);
      if (ss && ss.ts && (Date.now() - ss.ts) < CW_SS_TTL && ss.mapa) {
        _cwMapa = ss.mapa; _cwCfg = ss.cfg;
        _cwPreencherSlots();
        return;
      }
    }
  } catch (e) { /* SS indisponível — busca no servidor */ }

  _cwCarregando = true;
  google.script.run
    .withSuccessHandler(function(res) {
      _cwCarregando = false;
      if (!res || !res.ok || !res.mapa) return;
      _cwMapa = res.mapa;
      _cwCfg  = { baseUrl: res.baseUrl, accountId: res.accountId };
      try { sessionStorage.setItem(CW_SS_KEY, JSON.stringify({ ts: Date.now(), mapa: _cwMapa, cfg: _cwCfg })); } catch (e) {}
      _cwPreencherSlots();
    })
    .withFailureHandler(function(err) {
      _cwCarregando = false;
      console.warn('Chatwoot: mapa indisponível —', err && err.message ? err.message : err);
    })
    .getMapaConversasChatwoot();
}

function _lmaPeriodoLabel() {
  if (_lmaPeriodo === 'hoje') return 'Hoje';
  if (_lmaPeriodo === 'semana') return 'Esta semana';
  if (_lmaPeriodo === 'mes') return 'Este mês';
  if (_lmaPeriodo === '30d') return 'Últimos 30 dias';
  if (_lmaPeriodo === 'custom') {
    var de = document.getElementById('lmaDesde').value;
    var ate = document.getElementById('lmaAte').value;
    function br(ymd) {
      if (!ymd) return '';
      var p = ymd.split('-');
      return p.length === 3 ? (p[2] + '/' + p[1] + '/' + p[0]) : ymd;
    }
    if (de && ate) return br(de) + ' a ' + br(ate);
    if (de) return 'Desde ' + br(de);
    if (ate) return 'Até ' + br(ate);
    return 'Personalizado';
  }
  return 'Período filtrado';
}

function _lmaContarStatus(lista, status) {
  return lista.filter(function(l) { return _lmaStatusMesmo(l.status_final, status); }).length;
}

function _lmaGerarRelatorioTexto() {
  var lista = _lmaListaFiltrada && _lmaListaFiltrada.length
    ? _lmaListaFiltrada
    : _lmaOrdenar(_lmaDados.filter(function(l) { return _lmaMatch(l, {}); }));
  var cidades = {};
  lista.forEach(function(l) {
    var cidade = _lmaCidadeReal(l) || inferirCidadePorDDD(l.telefone) || '';
    cidade = String(cidade || '').trim();
    if (!cidade) return;
    cidades[cidade] = (cidades[cidade] || 0) + 1;
  });
  var topCidades = Object.keys(cidades).sort(function(a, b) {
    return cidades[b] - cidades[a] || a.localeCompare(b);
  }).slice(0, 5);

  var linhas = [
    '📊 *Resumo dos Leads - ' + _lmaPeriodoLabel() + '*',
    '',
    '📌 *Total de leads:* ' + lista.length,
    '',
    '✅ Venda fechada: ' + _lmaContarStatus(lista, 'venda-fechada'),
    '🤝 Em negociação: ' + _lmaContarStatus(lista, 'em-negociacao'),
    '❌ Venda perdida: ' + _lmaContarStatus(lista, 'venda-perdida'),
    '📭 Sem retorno: ' + _lmaContarStatus(lista, 'sem-retorno'),
    '🙅 Sem interesse: ' + _lmaContarStatus(lista, 'sem-interesse'),
    '📵 Sem viabilidade: ' + _lmaContarStatus(lista, 'sem-viabilidade'),
    '🚫 Reprovado CPF: ' + _lmaContarStatus(lista, 'reprovado-cpf'),
    '',
    '🏙️ *Principais cidades:*'
  ];
  if (topCidades.length) {
    topCidades.forEach(function(cidade) {
      linhas.push('• ' + cidade + ': ' + cidades[cidade]);
    });
  } else {
    linhas.push('• Sem cidades informadas');
  }
  return linhas.join('\n');
}

function _lmaAbrirRelatorio() {
  _lmaRelatorioAtual = _lmaGerarRelatorioTexto();
  var txt = document.getElementById('lmaRelatorioTexto');
  if (txt) txt.value = _lmaRelatorioAtual;
  var modal = document.getElementById('modalRelatorioLeads');
  if (modal) modal.classList.add('ativo');
}

function _lmaFecharRelatorio() {
  var modal = document.getElementById('modalRelatorioLeads');
  if (modal) modal.classList.remove('ativo');
}

function _lmaCopiarRelatorio() {
  var texto = _lmaRelatorioAtual || _lmaGerarRelatorioTexto();
  var txt = document.getElementById('lmaRelatorioTexto');
  if (txt && txt.value) texto = txt.value;
  function ok() { if (typeof mostrarToast === 'function') mostrarToast('Relatório copiado.', 'success'); }
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(texto).then(ok, function() { _lmaCopiarFallback(texto); ok(); });
  } else {
    _lmaCopiarFallback(texto);
    ok();
  }
}

// Etiquetas terminais do Chatwoot reconhecidas como desfecho de lead.
var LMA_STATUS_FECHADA  = 'venda-fechada';
var LMA_STATUS_PERDIDOS = ['venda-perdida', 'sem-retorno', 'sem-viabilidade', 'sem-interesse', 'reprovado-cpf'];

var LMA_STATUS_OPCOES = [
  { value: 'venda-fechada',   label: '✅ venda-fechada',   badge: 'converteu',      kanban: 'k-conv' },
  { value: 'venda-perdida',   label: '❌ venda-perdida',   badge: 'desqualificado', kanban: 'k-desq' },
  { value: 'em-negociacao',   label: '🤝 Em negociação',   badge: 'negociacao',     kanban: 'k-nego', aliases: ['em negociação'] },
  { value: 'sem-retorno',     label: '📭 sem-retorno',     badge: 'sem-contato',    kanban: 'k-desq' },
  { value: 'sem-viabilidade', label: '📵 sem-viabilidade', badge: 'desqualificado', kanban: 'k-desq' },
  { value: 'sem-interesse',   label: '🙅 sem-interesse',   badge: 'desqualificado', kanban: 'k-desq' },
  { value: 'reprovado-cpf',   label: '🚫 reprovado-cpf',   badge: 'desqualificado', kanban: 'k-desq' }
];

function _lmaStatusNorm(status) {
  return String(status || '').trim().toLowerCase();
}

function _lmaStatusCfg(status) {
  var s = _lmaStatusNorm(status);
  for (var i = 0; i < LMA_STATUS_OPCOES.length; i++) {
    var cfg = LMA_STATUS_OPCOES[i];
    if (_lmaStatusNorm(cfg.value) === s) return cfg;
    if ((cfg.aliases || []).indexOf(s) !== -1) return cfg;
  }
  return null;
}

function _lmaStatusLabel(status) {
  var cfg = _lmaStatusCfg(status);
  return cfg ? cfg.label : String(status || '').trim();
}

function _lmaStatusMesmo(a, b) {
  var cfgA = _lmaStatusCfg(a);
  var cfgB = _lmaStatusCfg(b);
  if (cfgA || cfgB) return cfgA === cfgB;
  return _lmaStatusNorm(a) === _lmaStatusNorm(b);
}

function _lmaStatusOptionsHtml(statusAtual) {
  var atual = _lmaStatusNorm(statusAtual);
  return LMA_STATUS_OPCOES.map(function(cfg) {
    var selected = (_lmaStatusNorm(cfg.value) === atual || (cfg.aliases || []).indexOf(atual) !== -1) ? ' selected' : '';
    return '<option value="' + _esc(cfg.value) + '"' + selected + '>' + _esc(cfg.label) + '</option>';
  }).join('');
}

// ── KPIs client-side (respeitam os filtros) ──
function _lmaAtualizarKPIs(lista) {
  var total = lista.length;
  var ini = _lmaInicioHoje();
  var novos = _lmaDados.filter(function(l) {
    if (!_lmaMatch(l, { ignorarPeriodo: true })) return false;
    var dt = _lmaParseBR(l.data_entrada); return dt && dt >= ini;
  }).length;

  var abertos = lista.filter(function(l) { return !l.status_final; });
  var agora = Date.now();
  var emRisco = abertos.filter(function(l) {
    var ref = _lmaParseBR(l.data_entrada);
    return ref && (agora - ref.getTime()) > 864e5; // >24h sem desfecho
  }).length;
  var conv = lista.filter(function(l) {
    return String(l.status_final || '').toLowerCase() === LMA_STATUS_FECHADA;
  }).length;
  var perdidosList = lista.filter(function(l) {
    return LMA_STATUS_PERDIDOS.indexOf(String(l.status_final || '').toLowerCase()) !== -1;
  });
  var taxa = total > 0 ? ((conv / total) * 100).toFixed(1) : '0';

  var negoAtivo = _lmaContarStatus(lista, 'em-negociacao');

  // ── 3 cards: só o que exige ação ──
  document.getElementById('kpiPend').textContent      = abertos.length;
  document.getElementById('kpiNegoAtivo').textContent = negoAtivo;
  document.getElementById('kpiConv').textContent      = conv;

  var elRisco = document.getElementById('kpiRisco');
  elRisco.textContent = emRisco > 0 ? (emRisco + ' em risco >24h') : 'nenhum parado >24h';
  elRisco.className   = 'kpi-d' + (emRisco > 0 ? ' warn' : '');

  var elTaxa = document.getElementById('kpiTaxa');
  elTaxa.textContent = 'taxa ' + taxa + '%';
  elTaxa.className   = 'kpi-d' + (conv > 0 ? ' good' : '');

  // ── Resumo do header: total, novos hoje e perdidos (com breakdown no title) ──
  var mc = {};
  perdidosList.forEach(function(l) {
    var s = String(l.status_final || '').toLowerCase();
    mc[s] = (mc[s] || 0) + 1;
  });
  var breakdown = Object.keys(mc).sort(function(a, b) { return mc[b] - mc[a]; })
    .map(function(m) { return _lmaStatusLabel(m) + ': ' + mc[m]; }).join(' · ');

  _lmaSetResumo({
    total:    total,
    novos:    novos,
    perdidos: perdidosList.length,
    breakdown: breakdown
  });
}

// Escreve a linha de resumo do header, preservando o dot de reconciliação
// (que é gravado por _lmaCarregarReconc e sobrevive a cada re-render).
var _lmaReconcDot = { classe: 'off', title: 'Reconciliação Painel Ads ↔ CRM ainda não consultada.' };

function _lmaSetResumo(r) {
  var el = document.getElementById('lmaSub');
  if (!el) return;
  if (r) _lmaSetResumo._ultimo = r;
  var d = _lmaSetResumo._ultimo;
  if (!d) return;
  var partes = [
    '<b>' + d.total + '</b> no período',
    '<b>' + d.novos + '</b> ' + (d.novos === 1 ? 'novo' : 'novos') + ' hoje'
  ];
  if (d.perdidos > 0) partes.push('<span class="warn">' + d.perdidos + '</span> perdidos');
  el.innerHTML = '<span class="lma-dot ' + _lmaReconcDot.classe + '" title="' + _esc(_lmaReconcDot.title) + '"></span>' +
                 partes.join(' · ');
  el.title = d.breakdown ? ('Perdidos — ' + d.breakdown) : '';
}

// "agora" / "há 12min" / "há 2h" / "há 3d" — substitui a coluna "Atualizado em".
function _lmaTempoRelativo(dt) {
  if (!dt) return '';
  var seg = Math.floor((Date.now() - dt.getTime()) / 1000);
  if (seg < 0)    return 'agendado';
  if (seg < 90)   return 'agora';
  var min = Math.floor(seg / 60);
  if (min < 60)   return 'há ' + min + 'min';
  var h = Math.floor(min / 60);
  if (h < 24)     return 'há ' + h + 'h';
  var d = Math.floor(h / 24);
  if (d < 30)     return 'há ' + d + 'd';
  return 'há ' + Math.floor(d / 30) + 'mes';
}

function _lmaAtualizarSortInd() {
  ['data_entrada','nome','cidade','utm_campaign','status_final'].forEach(function(c) {
    var el = document.getElementById('sortInd_' + c);
    if (el) el.textContent = (_lmaSortDir && _lmaSortCol === c) ? (_lmaSortDir === 'asc' ? '▲' : '▼') : '';
  });
}

function _lmaRenderizarTabela(lista) {
  if (!lista.length) {
    document.getElementById('lmaTbody').innerHTML =
      '<tr><td colspan="6" class="lma-empty">Nenhum lead nesse filtro. Amplie o período ou limpe os filtros.</td></tr>';
    return;
  }

  var html = lista.map(function(l) {
    var statusLow = String(l.status_final || '').toLowerCase();
    var risco   = _lmaEmRisco(l);
    var trClass = statusLow === LMA_STATUS_FECHADA ? ' class="lma-tr-conv"' : (risco ? ' class="lma-tr-risco"' : '');

    // ── Entrada: data curta + tempo relativo (absorve a coluna "Atualizado em") ──
    var dtEntrada = _lmaParseBR(l.data_entrada);
    var dataCurta = dtEntrada ? _lmaFmtCurta(dtEntrada) : (l.data_entrada || '—');
    var dtStatus  = _lmaParseBR(l.data_status);
    var ago       = _lmaTempoRelativo(dtStatus || dtEntrada);
    var agoTitle  = (dtStatus ? 'Status atualizado em ' + l.data_status : 'Entrou em ' + (l.data_entrada || '—'));

    // ── Lead: nome editável + telefone + origem + conversa ──
    var telNorm = _lmaNormTel(l.telefone);
    var telHtml = '<span class="lma-tel">' + _esc(l.telefone || '—') + '</span>' +
      (telNorm ? '<button class="lma-copy" title="Copiar telefone" onclick="_lmaCopiarTelefone(\'' + telNorm + '\')">copiar</button>' : '');

    // ── Campanha: chip + anúncio como subtítulo (absorve a coluna "Anúncio") ──
    var campCell = _lmaChipCampanha(l.utm_campaign) +
      (l.utm_ad ? '<div class="lma-anun" title="Anúncio / criativo">' + _esc(l.utm_ad) + '</div>' : '');

    // ── Ação: select que salva no change + menu ⋯ ──
    var acaoHtml =
      '<div class="lma-acao-row">' +
        '<select class="lma-acao-sel" id="lmaAcaoSel_' + l.linha + '" onchange="_lmaOnStatusChange(' + l.linha + ')">' +
          '<option value="">— sem etiqueta —</option>' +
          _lmaStatusOptionsHtml(statusLow) +
        '</select>' +
        '<button class="lma-kebab" title="Mais ações" onclick="_lmaAbrirMenu(event,' + l.linha + ')">⋯</button>' +
      '</div>';

    return '<tr' + trClass + '>' +
      '<td>' +
        '<span class="lma-mono" title="' + _esc(l.data_entrada || '') + '">' + _esc(dataCurta) + '</span>' +
        (ago ? '<div class="lma-ago" title="' + _esc(agoTitle) + '">' + _esc(ago) + '</div>' : '') +
      '</td>' +
      '<td>' +
        '<div class="lma-nome" id="lmaNomeCell_' + l.linha + '">' + _lmaNomeInner(l) + '</div>' +
        '<div class="lma-linha2">' + telHtml + _lmaOrigemChip(l.origem) + _cwSlot(l) + '</div>' +
      '</td>' +
      '<td id="lmaCidadeCell_' + l.linha + '">' + _lmaCidadeInner(l) + '</td>' +
      '<td>' + campCell + '</td>' +
      '<td>' + _lmaBadge(l.status_final, l.motivo_desq) + '</td>' +
      '<td class="lma-acao-cell">' + acaoHtml + '</td>' +
    '</tr>';
  }).join('');

  document.getElementById('lmaTbody').innerHTML = html;
}

// dd/MM HH:mm — o ano fica no title, que é onde ele importa.
function _lmaFmtCurta(dt) {
  function p(n) { return ('0' + n).slice(-2); }
  return p(dt.getDate()) + '/' + p(dt.getMonth() + 1) + ' ' + p(dt.getHours()) + ':' + p(dt.getMinutes());
}

// Chip de campanha com cor determinística pelo nome (matiz estável, tom sóbrio).
function _lmaChipCampanha(nome) {
  if (!nome) return '<span class="lma-mono">—</span>';
  var h = _lmaCampanhaCor(nome);
  var style = 'color:hsl(' + h + ',62%,68%);' +
              'background:hsla(' + h + ',62%,60%,.13);' +
              'border-color:hsla(' + h + ',62%,62%,.32)';
  return '<span class="lma-chip-camp" style="' + style + '" title="' + _esc(nome) + '">' + _esc(nome) + '</span>';
}

// ── Menu ⋯ da coluna Ação (copiar telefone / excluir) ──
var _lmaMenuAberto = null;

function _lmaFecharMenu() {
  if (_lmaMenuAberto && _lmaMenuAberto.parentNode) _lmaMenuAberto.parentNode.removeChild(_lmaMenuAberto);
  _lmaMenuAberto = null;
}

function _lmaAbrirMenu(ev, linha) {
  ev.stopPropagation();
  var jaEra = _lmaMenuAberto && _lmaMenuAberto.dataset.linha === String(linha);
  _lmaFecharMenu();
  if (jaEra) return;                       // 2º clique no mesmo ⋯ fecha

  var cell = ev.currentTarget.closest('td');
  if (!cell) return;
  var lead = _lmaDados.find(function(l) { return l.linha === linha; });
  var telNorm = lead ? _lmaNormTel(lead.telefone) : '';

  var menu = document.createElement('div');
  menu.className = 'lma-menu';
  menu.dataset.linha = String(linha);
  menu.innerHTML =
    (telNorm ? '<button onclick="_lmaFecharMenu();_lmaCopiarTelefone(\'' + telNorm + '\')">Copiar telefone</button>' : '') +
    '<button class="danger" onclick="_lmaFecharMenu();_lmaExcluir(' + linha + ')">Excluir lead</button>';
  menu.onclick = function(e) { e.stopPropagation(); };
  cell.appendChild(menu);
  _lmaMenuAberto = menu;
  setTimeout(function() { document.addEventListener('click', _lmaFecharMenu, { once: true }); }, 0);
}

// Lead em aberto há mais de 24h sem desfecho (sinal de risco).
function _lmaEmRisco(l) {
  if (l.status_final) return false;
  var ref = _lmaParseBR(l.data_entrada);
  return !!ref && (Date.now() - ref.getTime()) > 864e5;
}

// Matiz determinística por nome de campanha — 12 tons espaçados. Retorna só o
// hue; saturação/luminosidade ficam fixas em _lmaChipCampanha, pro chip nunca
// competir em peso visual com os badges de status.
function _lmaCampanhaCor(nome) {
  var hues = [190, 95, 265, 40, 340, 160, 220, 15, 285, 130, 55, 310];
  var h = 0, s = String(nome || '');
  for (var i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) >>> 0;
  return hues[h % hues.length];
}

function _lmaCopiarTelefone(tel) {
  tel = String(tel || '');
  if (!tel) { if (typeof mostrarToast === 'function') mostrarToast('Telefone vazio.', 'warning'); return; }
  function ok() { if (typeof mostrarToast === 'function') mostrarToast('Telefone copiado: ' + tel, 'success'); }
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(tel).then(ok, function() { _lmaCopiarFallback(tel); ok(); });
  } else { _lmaCopiarFallback(tel); ok(); }
}
function _lmaCopiarFallback(tel) {
  var ta = document.createElement('textarea');
  ta.value = tel; ta.style.position = 'fixed'; ta.style.opacity = '0';
  document.body.appendChild(ta); ta.select();
  try { document.execCommand('copy'); } catch (e) {}
  document.body.removeChild(ta);
}

// Rótulo sem o emoji do LMA_STATUS_OPCOES (que fica reservado pros selects).
function _lmaLabelLimpo(status) {
  return String(_lmaStatusLabel(status) || '').replace(/^[^A-Za-zÀ-ÿ0-9]+/, '').trim();
}

// O motivo legado (col J) entra embaixo do badge — absorve a antiga coluna
// "Motivo desq.", que ficava vazia em tudo que não era perda.
function _lmaBadge(status, motivo) {
  if (!status) return '<span class="lma-badge pendente">em aberto</span>';
  var cfg = _lmaStatusCfg(status);
  var cls = cfg ? cfg.badge : 'pendente';
  var extra = (motivo && LMA_STATUS_PERDIDOS.indexOf(String(status).toLowerCase()) !== -1)
    ? '<span class="lma-badge-motivo" title="Motivo registrado (legado)">' + _esc(motivo) + '</span>'
    : '';
  return '<span class="lma-badge ' + cls + '">' + _esc(_lmaLabelLimpo(status)) + '</span>' + extra;
}

function _lmaFmtData(val) {
  if (!val) return '—';
  try {
    var d = new Date(val);
    if (isNaN(d)) return String(val);
    var dd = String(d.getDate()).padStart(2,'0');
    var mm = String(d.getMonth()+1).padStart(2,'0');
    var hh = String(d.getHours()).padStart(2,'0');
    var mi = String(d.getMinutes()).padStart(2,'0');
    return dd + '/' + mm + '/' + d.getFullYear() + ' ' + hh + ':' + mi;
  } catch(e) { return String(val); }
}

// Salva no próprio change do select — o antigo botão ✓ era um 2º clique
// obrigatório em toda mudança. Update otimista + rollback, mesmo padrão que o
// drag-and-drop do kanban (_lmaDrop) já usava.
function _lmaOnStatusChange(linha) {
  var sel  = document.getElementById('lmaAcaoSel_' + linha);
  var lead = _lmaDados.find(function(l) { return l.linha === linha; });
  if (!sel || !lead) return;

  var novoStatus = sel.value;
  if (_lmaStatusMesmo(lead.status_final, novoStatus)) return;  // nada mudou

  var anterior = lead.status_final;
  var motivo = '';   // col J é read-only na taxonomia Chatwoot (ver nota no topo)

  sel.disabled = true;
  lead.status_final = novoStatus;
  lead.data_status  = _lmaFmtData(new Date().toISOString());

  // Repinta só a célula do badge: um _lmaFiltrar() aqui roubaria o foco do select.
  var tr = sel.closest('tr');
  function pintar(st, mt) { if (tr && tr.cells[4]) tr.cells[4].innerHTML = _lmaBadge(st, mt); }
  pintar(novoStatus, motivo);

  google.script.run
    .withSuccessHandler(function() {
      sel.disabled = false;
      mostrarToast('Status: ' + (novoStatus ? _lmaLabelLimpo(novoStatus) : 'em aberto'), 'success');
      _lmaAtualizarKPIs(_lmaListaFiltrada);
      var pendentes = _lmaDados.filter(function(l) { return !l.status_final; }).length;
      if (typeof _lmaAtualizarBadge === 'function') _lmaAtualizarBadge(pendentes);
    })
    .withFailureHandler(function(e) {
      sel.disabled = false;
      lead.status_final = anterior;               // reverte
      var cfgAnt = _lmaStatusCfg(anterior);
      sel.value = cfgAnt ? cfgAnt.value : '';
      pintar(anterior, lead.motivo_desq);
      mostrarToast('Erro ao salvar: ' + (e && e.message ? e.message : String(e)), 'error');
    })
    .atualizarStatusLeadMetaAds(linha, novoStatus, motivo);
}

function _lmaExcluir(linha) {
  var lead = _lmaDados.find(function(l) { return l.linha === linha; });
  var nome = lead ? (lead.nome || lead.telefone || ('linha ' + linha)) : ('linha ' + linha);
  if (!confirm('Excluir o lead "' + nome + '"?\nEssa ação remove a linha da planilha e não pode ser desfeita.')) return;

  google.script.run
    .withSuccessHandler(function(res) {
      if (res && res.ok) {
        mostrarToast('Lead excluído.', 'success');
        _lmaDados = _lmaDados.filter(function(l) { return l.linha !== linha; });
        _lmaDados.forEach(function(l) { if (l.linha > linha) l.linha -= 1; });
        var pendentes = _lmaDados.filter(function(l) { return !l.status_final; }).length;
        if (typeof _lmaAtualizarBadge === 'function') _lmaAtualizarBadge(pendentes);
        _lmaFiltrar();
      } else {
        mostrarToast('Erro ao excluir.', 'error');
      }
    })
    .withFailureHandler(function(e) {
      mostrarToast('Erro ao excluir: ' + (e && e.message ? e.message : String(e)), 'error');
    })
    .excluirLeadMetaAds(linha);
}

// ─── Reconciliação Painel Ads ↔ CRM ────────────────────────────────────────
// Estando tudo certo, o estado cabe no dot verde do resumo do header — a faixa
// só aparece quando há divergência a explicar (severidade 'aviso').
function _lmaCarregarReconc() {
  var bar = document.getElementById('lmaReconc');
  if (!bar) return;
  google.script.run
    .withSuccessHandler(function(r) {
      if (!r || !r.ok || !r.resumo) {
        _lmaReconcDot = { classe: 'off', title: 'Reconciliação Painel Ads ↔ CRM indisponível.' };
        bar.classList.remove('on');
      } else if (r.severidade === 'aviso') {
        _lmaReconcDot = { classe: 'warn', title: r.resumo };
        document.getElementById('lmaReconcTxt').textContent = r.resumo;
        if (sessionStorage.getItem('leads_meta_ads_reconc_oculto') !== '1') bar.classList.add('on');
      } else {
        _lmaReconcDot = { classe: '', title: r.resumo };
        bar.classList.remove('on');
      }
      _lmaSetResumo(null);   // repinta o dot sem recalcular os números
    })
    .withFailureHandler(function() {
      _lmaReconcDot = { classe: 'off', title: 'Reconciliação Painel Ads ↔ CRM indisponível.' };
      bar.classList.remove('on');
      _lmaSetResumo(null);
    })
    .getDiagnosticoReconciliacaoMeta();
}
function _lmaFecharReconc() {
  var bar = document.getElementById('lmaReconc');
  if (bar) bar.classList.remove('on');
  try { sessionStorage.setItem('leads_meta_ads_reconc_oculto', '1'); } catch (e) {}
}

// ─── Chip de origem do lead ─────────────────────────────────────────────────
function _lmaOrigemChip(origem) {
  var o = String(origem || 'webhook').toLowerCase();
  var map = {
    webhook: { lbl: 'webhook', cls: 'og-webhook', t: 'Chegou pelo webhook do Botconversa' },

// Retorna {ddd, cidade, uf, cob} ou null se não há DDD confiável.
// DDD válido fora da tabela → cidade/uf vazios e cob 'nao' (fora da área).
function _lmaDddInfo(telefone) {
  var d = String(telefone || '').replace(/\D/g, '');
  if (d.length >= 12 && d.indexOf('55') === 0) d = d.slice(2); // remove DDI
  if (d.length < 10 || d.length > 11) return null;             // sem DDD confiável
  var ddd = d.slice(0, 2);
  var info = DDD_INFO[ddd];
  return info
    ? { ddd: ddd, cidade: info.cidade, uf: info.uf, cob: info.cob }
    : { ddd: ddd, cidade: '', uf: '', cob: 'nao' };
}

function inferirCidadePorDDD(telefone)    { var i = _lmaDddInfo(telefone); return i ? i.cidade : ''; }
function inferirEstadoPorDDD(telefone)    { var i = _lmaDddInfo(telefone); return i ? i.uf : ''; }
function inferirCoberturaPorDDD(telefone) { var i = _lmaDddInfo(telefone); return i ? i.cob : ''; }

function _lmaCidadeReal(l) {
  var c = String((l && l.cidade) || '').trim();
  if (!c || c === 'Não informada' || c === '—') return '';
  return c;
}

function _lmaCidadeInner(l) {
  var real = _lmaCidadeReal(l);
  if (real) {
    return '<span class="lma-cidade-edit" title="Clique para editar" onclick="_lmaEditarCidade(' + l.linha + ')">' + _esc(real) + '</span>';
  }
  var sug = inferirCidadePorDDD(l.telefone);
  if (sug) {
    return '<span class="lma-cidade-edit lma-cidade-sug" title="Sugerido pelo DDD — clique para confirmar ou editar" onclick="_lmaEditarCidade(' + l.linha + ')">≈ ' + _esc(sug) + '</span>';
  }
  return '<span class="lma-cidade-edit lma-cidade-vazia" title="Clique para informar a cidade" onclick="_lmaEditarCidade(' + l.linha + ')">—</span>';
}

function _lmaEditarCidade(linha) {
  var cell = document.getElementById('lmaCidadeCell_' + linha);
  var lead = _lmaDados.find(function(l) { return l.linha === linha; });
  if (!cell || !lead) return;
  var atual = _lmaCidadeReal(lead) || inferirCidadePorDDD(lead.telefone) || '';
  cell.innerHTML = '<input type="text" class="lma-cidade-input" id="lmaCidadeInput_' + linha + '" value="' + _esc(atual) + '">';
  var inp = document.getElementById('lmaCidadeInput_' + linha);

  inp.focus(); inp.select();
  var feito = false;
  function commit() { if (feito) return; feito = true; _lmaSalvarCidade(linha, inp.value); }
  function cancelar() { if (feito) return; feito = true; _lmaRenderCidadeCell(linha); }
  inp.addEventListener('keydown', function(e) {
    if (e.key === 'Enter') { e.preventDefault(); commit(); }
    else if (e.key === 'Escape') { e.preventDefault(); cancelar(); }
  });
  inp.addEventListener('blur', commit);
}

function _lmaSalvarCidade(linha, valor) {
  valor = String(valor || '').trim();
  var lead = _lmaDados.find(function(l) { return l.linha === linha; });

  var cell = document.getElementById('lmaCidadeCell_' + linha);

  google.script.run

// Mapa campanha→criativos, preenchido dinamicamente por _lmaCarregarCampanhasDropdown()
// a partir da Meta API (backend getCampanhasAtivasParaDropdown). Sem lista hardcoded.
var CRIATIVOS_POR_CAMPANHA = {};

function abrirModalManual() {
  document.getElementById('modalManual').classList.add('ativo');
  _lmaCarregarCampanhasDropdown();
  document.getElementById('mlNome').focus();
}

// Carrega o dropdown de Campanha dinamicamente da Meta API (campanhas ATIVAS).
function _lmaCarregarCampanhasDropdown() {
  var sel = document.getElementById('mlCampanha');
  var retry = document.getElementById('mlCampanhaRetry');
  if (retry) retry.style.display = 'none';
  sel.innerHTML = '<option value="">Carregando campanhas…</option>';

  google.script.run
    .withSuccessHandler(function(resp) {
      if (!resp || !resp.ok || !resp.campanhas) {
        // Falha conhecida do backend (Meta API fora) — sinaliza, sem fallback silencioso.
        sel.innerHTML = '<option value="">(sem conexão Meta — recarregue)</option>';
        if (retry) retry.style.display = 'inline';
        CRIATIVOS_POR_CAMPANHA = {};
        return;
      }
      var mapa = {};
      var html = '<option value="">Selecione...</option>';
      resp.campanhas.forEach(function(c) {
        mapa[c.label] = c.anuncios || [];
        html += '<option value="' + _esc(c.label) + '">' + _esc(c.label) + '</option>';
      });
      sel.innerHTML = html;
      CRIATIVOS_POR_CAMPANHA = mapa;
      atualizarOpcoesCriativo();
    })
    .withFailureHandler(function(e) {
      sel.innerHTML = '<option value="">(sem conexão Meta — recarregue)</option>';
      if (retry) retry.style.display = 'inline';
      CRIATIVOS_POR_CAMPANHA = {};
    })
    .getCampanhasAtivasParaDropdown();
}

function fecharModalManual() {
  document.getElementById('modalManual').classList.remove('ativo');
  document.getElementById('mlStatus').textContent = '';
  ['mlNome','mlTelefone','mlCidade'].forEach(function(id) {
    document.getElementById(id).value = '';
  });
  document.getElementById('mlCampanha').value = '';
  atualizarOpcoesCriativo();
}

function atualizarOpcoesCriativo() {
  var campanha = document.getElementById('mlCampanha').value;
  var select   = document.getElementById('mlCriativo');
  var opcoes   = CRIATIVOS_POR_CAMPANHA[campanha] || [];
  select.innerHTML = opcoes.length
    ? opcoes.map(function(c) { return '<option value="' + c + '">' + c + '</option>'; }).join('')
    : '<option value="">Selecione a campanha primeiro</option>';
}

function salvarLeadManual() {
  var nome     = document.getElementById('mlNome').value.trim();
  var telefone = document.getElementById('mlTelefone').value.trim();
  var campanha = document.getElementById('mlCampanha').value;

  if (!nome || !telefone || !campanha) {
    document.getElementById('mlStatus').textContent = '⚠️ Preencha nome, telefone e campanha.';
    document.getElementById('mlStatus').style.color = '#e53';
    return;
  }

  var btn = document.getElementById('btnSalvarManual');
  btn.disabled = true;
  btn.textContent = 'Salvando…';
  document.getElementById('mlStatus').textContent = '';

  var dados = {
    nome:         nome,
    telefone:     telefone,
    cidade:       document.getElementById('mlCidade').value.trim() || 'Não informada',
    utm_source:   'meta_ads',
    utm_campaign: campanha,
    utm_medium:   'cpc',
    utm_ad:       document.getElementById('mlCriativo').value || ''
  };

  google.script.run
    .withSuccessHandler(function(resp) {
      btn.disabled = false;
      btn.textContent = 'Registrar lead';
      if (resp && resp.ok) {
        document.getElementById('mlStatus').textContent = '✅ Lead registrado na linha ' + resp.linha;
        document.getElementById('mlStatus').style.color = '#2a7';
        setTimeout(function() {
          fecharModalManual();
          if (typeof carregarLeadsMetaAds === 'function') carregarLeadsMetaAds();
        }, 1800);
      } else {
        document.getElementById('mlStatus').textContent = '❌ Erro: ' + (resp && resp.erro ? resp.erro : 'tente novamente');
        document.getElementById('mlStatus').style.color = '#e53';
      }
    })
    .withFailureHandler(function(err) {
      btn.disabled = false;
      btn.textContent = 'Registrar lead';
      document.getElementById('mlStatus').textContent = '❌ Falha na chamada: ' + err.message;
      document.getElementById('mlStatus').style.color = '#e53';
    })
    .registrarLeadManual(dados);
}

function _lmaToggleAutoRefresh() {

  _lmaAgendarAutoRefresh();

function _lmaPintarAutoTag() {
  var tag = document.getElementById('lmaAutoTag');
  if (!tag) return;
  tag.classList.toggle('on', _lmaAutoOn);
  tag.title = _lmaAutoOn
    ? 'Recarregando sozinho a cada 60s. Clique para desligar.'
    : 'Auto-refresh desligado. Clique para ligar (recarrega a cada 60s).';
}
function _lmaAgendarAutoRefresh() {
  if (_lmaTimer) { clearInterval(_lmaTimer); _lmaTimer = null; }
  if (!_lmaAutoOn) return;
  _lmaTimer = setInterval(function() {
    var pg = document.getElementById('pageLeadsMetaAds');
    if (!pg || !pg.classList.contains('ativa')) return; // só atualiza se a página está visível
    _lmaRefetch();
  }, 60000);
}
function _lmaRefetch() {
  var spin = document.getElementById('lmaRefreshSpin');
  if (spin) { spin.classList.add('girando'); setTimeout(function() { spin.classList.remove('girando'); }, 1000); }
  google.script.run
    .withSuccessHandler(function(res) {
      if (!res || res.erro) return;
      _lmaDados = res.leads || [];
      _lmaPopularFiltros();
      _lmaFiltrar();
    })
    .withFailureHandler(function() {})
    .getLeadsMetaAds();
}

// ─── Exportação CSV (client-side, respeita filtros + ordenação) ─────────────
function _lmaExportarCSV() {
  var lista = _lmaOrdenar(_lmaDados.filter(function(l) { return _lmaMatch(l, {}); }));
  if (!lista.length) { if (typeof mostrarToast === 'function') mostrarToast('Nenhum lead pra exportar com esse filtro.', 'warning'); return; }

  var cols = [
    ['Data entrada', function(l) { return l.data_entrada || ''; }],
    ['Nome',         function(l) { return l.nome || ''; }],
    ['Telefone',     function(l) { return l.telefone || ''; }],
    ['Telefone norm',function(l) { return _lmaNormTel(l.telefone); }],
    ['Cidade',       function(l) { return _lmaCidadeReal(l) || inferirCidadePorDDD(l.telefone) || ''; }],
    ['Estado',       function(l) { return inferirEstadoPorDDD(l.telefone) || ''; }],
    ['Campanha',     function(l) { return l.utm_campaign || ''; }],
    ['Anuncio',      function(l) { return l.utm_ad || ''; }],
    ['utm_source',   function(l) { return l.utm_source || ''; }],
    ['Origem',       function(l) { return l.origem || 'webhook'; }],
    ['Status',       function(l) { return l.status_final || 'Pendente'; }],
    ['Motivo desq',  function(l) { return l.motivo_desq || ''; }],
    ['Atualizado em',function(l) { return l.data_status || ''; }]
  ];
  function cel(v) { v = String(v == null ? '' : v).replace(/"/g, '""'); return '"' + v + '"'; }
  var linhas = [cols.map(function(c) { return cel(c[0]); }).join(';')];
  lista.forEach(function(l) { linhas.push(cols.map(function(c) { return cel(c[1](l)); }).join(';')); });

  var csv = '﻿' + linhas.join('\r\n'); // BOM UTF-8 p/ Excel pt-BR
  var hoje = new Date();
  var ymd = hoje.getFullYear() + ('0' + (hoje.getMonth() + 1)).slice(-2) + ('0' + hoje.getDate()).slice(-2);
  var nome = 'leads_meta_ads_' + _lmaPeriodo + '_' + ymd + '.csv';
  var blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
  var url = URL.createObjectURL(blob);
  var a = document.createElement('a');
  a.href = url; a.download = nome; document.body.appendChild(a); a.click();
  document.body.removeChild(a); setTimeout(function() { URL.revokeObjectURL(url); }, 1000);
  if (typeof mostrarToast === 'function') mostrarToast('Exportado: ' + nome + ' (' + lista.length + ' leads)', 'success');
}

// ─── Kanban ─────────────────────────────────────────────────────────────────
function _lmaStatusLow(l) { return String(l && l.status_final || '').toLowerCase(); }

var _LMA_COLUNAS = [
  { id: '__aberto', titulo: 'Em aberto', classe: 'k-pend', match: function(l) { return !l.status_final; } }
];
LMA_STATUS_OPCOES.forEach(function(cfg) {
  _LMA_COLUNAS.push({
    id: cfg.value,
    titulo: cfg.label,
    classe: cfg.kanban,
    match: function(l) { return _lmaStatusCfg(l.status_final) === cfg; }
  });
});

function _lmaRenderKanban(lista) {
  var wrap = document.getElementById('lmaKanbanWrap');
  if (!wrap) return;
  if (!lista.length) {
    wrap.innerHTML = '<div class="lma-empty">Nenhum lead encontrado pra esse filtro. Tente ampliar o período ou remover filtros.</div>';
    return;
  }
  var html = '';
  _LMA_COLUNAS.forEach(function(col) {
    var cards = lista.filter(col.match);
    html += '<div class="lma-kcol ' + col.classe + '" data-col="' + col.id + '" ' +
      'ondragover="_lmaDragOver(event)" ondragleave="_lmaDragLeave(event)" ondrop="_lmaDrop(event,\'' + col.id + '\')">';
    var titulo = String(col.titulo || '').replace(/^[^A-Za-zÀ-ÿ0-9]+/, '').trim();
    html += '<div class="lma-kcol-head"><span>' + _esc(titulo) + '</span>' +
            '<span class="lma-kcol-count">' + cards.length + '</span></div>';
    html += '<div class="lma-kcol-body">';
    cards.forEach(function(l) { html += _lmaKanbanCard(l); });
    if (!cards.length) html += '<div class="lma-kcol-vazio">—</div>';
    html += '</div></div>';
  });
  wrap.innerHTML = html;
}

function _lmaKanbanCard(l) {
  var risco = _lmaEmRisco(l);
  var conv = _lmaStatusLow(l) === 'venda-fechada';
  var cls = 'lma-kcard' + (conv ? ' kc-conv' : (risco ? ' kc-risco' : ''));
  var telNorm = _lmaNormTel(l.telefone);
  var cidade = _lmaCidadeReal(l) || inferirCidadePorDDD(l.telefone);
  var cidadeHtml = cidade ? '<div class="lma-kcard-cidade">' + (_lmaCidadeReal(l) ? '' : '≈ ') + _esc(cidade) + '</div>' : '';
  var telHtml = _esc(l.telefone || '') +
    (telNorm ? '<button class="lma-copy" title="Copiar telefone" onclick="event.stopPropagation();_lmaCopiarTelefone(\'' + telNorm + '\')">copiar</button>' : '');
  var camp = _lmaChipCampanha(l.utm_campaign);
  var motivo = (LMA_STATUS_PERDIDOS.indexOf(_lmaStatusLow(l)) !== -1 && l.motivo_desq)
    ? '<span class="lma-origem-chip">' + _esc(l.motivo_desq) + '</span>' : '';
  return '<div class="' + cls + '" draggable="true" data-linha="' + l.linha + '" ondragstart="_lmaDragStart(event,' + l.linha + ')">' +
    '<div class="lma-kcard-nome">' + _esc(l.nome || '—') + '</div>' +
    '<div class="lma-kcard-tel">' + telHtml + _cwSlot(l) + '</div>' +
    cidadeHtml +
    '<div class="lma-kcard-tags">' + camp + motivo + '</div>' +
  '</div>';
}

var _lmaDragLinha = null;
function _lmaDragStart(ev, linha) { _lmaDragLinha = linha; ev.dataTransfer.effectAllowed = 'move'; }
function _lmaDragOver(ev) { ev.preventDefault(); ev.currentTarget.classList.add('k-over'); }
function _lmaDragLeave(ev) { ev.currentTarget.classList.remove('k-over'); }
function _lmaDrop(ev, colId) {
  ev.preventDefault();
  ev.currentTarget.classList.remove('k-over');
  var linha = _lmaDragLinha; _lmaDragLinha = null;
  if (!linha) return;
  var lead = _lmaDados.find(function(l) { return l.linha === linha; });
  if (!lead) return;
  var novoStatus = (colId === '__aberto') ? '' : colId;
  if (_lmaStatusMesmo(lead.status_final, novoStatus)) return; // sem mudança
  var motivo = '';

  // Atualização otimista local + persiste.
  var anterior = lead.status_final;
  lead.status_final = novoStatus;
  lead.data_status = _lmaFmtData(new Date().toISOString());
  _lmaFiltrar();

  google.script.run
    .withSuccessHandler(function() {
      if (typeof mostrarToast === 'function') mostrarToast('Status atualizado: ' + (novoStatus ? _lmaStatusLabel(novoStatus) : 'Pendente'), 'success');
    })
    .withFailureHandler(function(e) {
      lead.status_final = anterior; // reverte
      _lmaFiltrar();
      if (typeof mostrarToast === 'function') mostrarToast('Erro ao mover: ' + (e && e.message ? e.message : String(e)), 'error');
    })
    .atualizarStatusLeadMetaAds(linha, novoStatus, motivo);
}

// ─── Init (uma vez, no load do Index) ───────────────────────────────────────
(function _lmaInit() {
  // popula filtro de status a partir de LMA_STATUS_OPCOES (fonte única)
  try {
    var selStatus = document.getElementById('lmaFiltroStatus');
    if (selStatus) selStatus.insertAdjacentHTML('beforeend', _lmaStatusOptionsHtml(''));
  } catch (e) {}
  try {
    var v = localStorage.getItem('leads_meta_ads_view');
    if (v === 'kanban' || v === 'lista') _lmaView = v;
    var ar = localStorage.getItem('leads_meta_ads_autorefresh');
    _lmaAutoOn = (ar === null) ? true : (ar === '1'); // default ligado
  } catch (e) {}
  _lmaPintarAutoTag();
  // restaura estado do painel de filtros avançados (default: fechado)
  try { _lmaToggleFiltros(localStorage.getItem('leads_meta_ads_filtros_abertos') === '1'); } catch (e) {}
  // aplica a view salva (atualiza botões + visibilidade)
  var bl = document.getElementById('lmaViewLista'), bk = document.getElementById('lmaViewKanban');
  if (bl && bk) {
    bl.classList.toggle('on', _lmaView === 'lista');
    bk.classList.toggle('on', _lmaView === 'kanban');
    document.getElementById('lmaListaWrap').style.display  = (_lmaView === 'lista') ? '' : 'none';
    document.getElementById('lmaKanbanWrap').style.display = (_lmaView === 'kanban') ? '' : 'none';
  }
  _lmaAgendarAutoRefresh();
})();
</script>
